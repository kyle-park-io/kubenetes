apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-app-server-deployment
  labels:
    app: site-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site-app
  template:
    metadata:
      labels:
        app: site-app
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: service-pool
      containers:
        - name: site-app-server
          image: 'me-west1-docker.pkg.dev/kyle-server-402706/kyle-registry/site-app-server:latest'
          ports:
            - protocol: TCP
              containerPort: 8080
          # Without a probe the pod counts as ready the moment the container
          # starts, so a rollout ended the old pod before express listened:
          # on 2026-11-18 the container started 14:50:17 UTC and express
          # logged "Server is running" at 14:50:19.289. index.json is the
          # file the ingress proxy reads for view counts, so a build without
          # it also never takes traffic and the old pod keeps serving.
          readinessProbe:
            httpGet:
              path: /blog/index.json
              port: 8080
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: site-app-server-service
  labels:
    app: site-app
spec:
  type: ClusterIP
  selector:
    app: site-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
