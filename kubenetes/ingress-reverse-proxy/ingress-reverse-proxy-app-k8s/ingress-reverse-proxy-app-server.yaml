apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-reverse-proxy-app-server-deployment
  labels:
    app: ingress-reverse-proxy-app
spec:
  replicas: 1
  # This pod binds hostPort 80/443 and hostNetwork, which are exclusive per
  # node, and the ingress pool has a single node. A RollingUpdate would start
  # the replacement before retiring the old pod, so the new pod can never get
  # the ports and sits Pending until the rollout times out -- while `kubectl
  # rollout restart` reports success and the old pod keeps serving. That is a
  # silent non-deploy, which is worse than the brief outage Recreate causes:
  # here the outage is explicit and the deploy actually happens.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ingress-reverse-proxy-app
  template:
    metadata:
      labels:
        app: ingress-reverse-proxy-app
    spec:
      # host networking config
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      nodeSelector:
        cloud.google.com/gke-nodepool: ingress-pool
      containers:
        - name: ingress-reverse-proxy-app-server
          image: 'me-west1-docker.pkg.dev/kyle-server-402706/kyle-registry/ingress-reverse-proxy-app-server:latest'
          ports:
            - name: http
              protocol: TCP
              hostPort: 80
              containerPort: 80
            - name: https
              protocol: TCP
              hostPort: 443
              containerPort: 443
            # - protocol: TCP
            #   containerPort: 8080
          # pvc
          volumeMounts:
            - mountPath: /data
              name: data-volume
      # pvc
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: hostpath-pvc
