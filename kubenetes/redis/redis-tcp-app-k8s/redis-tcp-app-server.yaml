apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-tcp-app-server-deployment
  labels:
    app: redis-tcp-app
spec:
  replicas: 1
  # Redis runs in this pod and keeps its snapshot on redis-pvc. A RollingUpdate
  # started the new pod first, so its Redis loaded the snapshot while the old
  # Redis was still taking writes, and the old one saved its last state only
  # when it stopped, after the new one had read the file: every deploy could
  # lose the writes since the last snapshot (save 3600 1, so up to an hour of
  # view counts). On 2026-11-19 00:25 KST the two pods ran together for 36s.
  # Recreate stops the old pod, and Redis saves, before the new one starts;
  # presence and view counts are down for those few seconds instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-tcp-app
  template:
    metadata:
      labels:
        app: redis-tcp-app
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: service-pool
      containers:
        - name: redis-tcp-app-server
          image: 'me-west1-docker.pkg.dev/kyle-server-402706/kyle-registry/redis-tcp-app-server:latest'
          ports:
            - protocol: TCP
              containerPort: 8080
          # pvc
          volumeMounts:
            - mountPath: /data
              name: data-volume
        - name: redis
          image: 'redis:latest'
          ports:
            - protocol: TCP
              containerPort: 6379
          # pvc
          volumeMounts:
            - mountPath: /data
              name: data-volume2
      # pvc
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: redis-server-pvc
        - name: data-volume2
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-tcp-app-server-service
  labels:
    app: redis-tcp-app
spec:
  type: ClusterIP
  selector:
    app: redis-tcp-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
